##########################################################################################
#                        Append Compiler Options For Source Files
##########################################################################################

# syntax:
#   <your pattern>: <compiler options>
# For get pattern syntax, please refer to: https://www.npmjs.com/package/micromatch
#
# examples:
#   'main.cpp':           --cpp11 -Og ...
#   'src/*.c':            -gnu -O2 ...
#   'src/lib/**/*.cpp':   --cpp11 -Os ...
#   '!Application/*.c':   -O0
#   '**/*.c':             -O2 -gnu ...

version: "2.1"
options:
    ADC_USB:
        # [NEW] FIR: DSP 内层循环在全局 -O1 下寄存器溢出严重（约 52% CPU），
        # 只给这三个文件单独开 -O2（约 22%），其余文件保持全局 -O1。
        files:
            'CMSIS_DSP/Source/arm_fir_q15.c': -O2
            'CMSIS_DSP/Source/arm_fir_init_q15.c': -O2
            'SERVICE/adc_fir.c': -O2
        virtualPathFiles: {}
