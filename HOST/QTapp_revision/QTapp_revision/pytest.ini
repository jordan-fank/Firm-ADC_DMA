[pytest]
# pytest配置文件

# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    smoke: 冒烟测试，快速验证核心功能
    unit: 单元测试
    integration: 集成测试
    ui: UI测试
    slow: 慢速测试

# 覆盖率配置
[coverage:run]
source = .
omit =
    tests/*
    build/*
    dist/*
    __pycache__/*
    *.spec

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
